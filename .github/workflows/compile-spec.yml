name: Compile SPIRA Specification

on:
  push:
    paths:
      - "document/**"
      - ".github/workflows/compile-spec.yml"
  pull_request:
    paths:
      - "document/**"
      - ".github/workflows/compile-spec.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install LaTeX tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern latexmk

      - name: Compile specification
        working-directory: document
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error \
            -outdir=build main.tex

      - name: Upload specification PDF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spira-specification
          path: document/build/main.pdf
          if-no-files-found: error
